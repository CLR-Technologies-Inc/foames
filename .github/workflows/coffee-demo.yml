name: Coffee demo

on:
  pull_request:
    paths:
      - examples/coffee/**
      - foames/foames_mes/counters.py
      - foames/foames_mes/oee.py
      - foames/foames_mes/work_instructions.py
      - foames/foames_mes/doctype/machine/**
      - foames/foames_mes/doctype/work_instruction/**
      - foames/foames_mes/doctype/work_instruction_step/**
      - foames/foames_bms/doctype/facility_asset/**
      - foames/foames_bms/doctype/facility_zone/**
      - foames/foames_life_sciences/**
      - foames/foames_validation/doctype/validation_protocol/**
      - foames/foames_validation/doctype/validation_acceptance_criterion/**
      - foames/foames_process_mining/**
      - .github/workflows/coffee-demo.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify coffee journey and calculations
        run: python -m unittest discover -s examples/coffee -v
      - name: Build portable website demo
        run: python examples/coffee/build.py --out .coffee-build
      - name: Check browser script syntax
        run: node --check .coffee-build/app.js
