name: Wiki sync

on:
  push:
    branches:
      - main
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

concurrency:
  group: wiki-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Copy docs/wiki to the GitHub wiki
    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Push the pages to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The wiki repository exists only after its first page has been created on github.com.
          if ! git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki; then
            echo "::error::The wiki has no pages yet. Create any first page at https://github.com/${REPO}/wiki once, then re-run this workflow."
            exit 1
          fi
          find wiki -maxdepth 1 -name '*.md' -delete
          find docs/wiki -maxdepth 1 -name '*.md' ! -name 'README.md' -exec cp {} wiki/ \;
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git commit -m "Sync the wiki from docs/wiki at ${GITHUB_SHA::7}"
          git push origin HEAD
