# Catches unintended disclosure with specific checks: secrets (gitleaks), guarded words, private
# author identities, and other people's email addresses in new content. Contributors' own identity,
# authorship trailers, attribution files and references already in the repository pass.
# The private list comes from the NAME_GUARD_WORDS repository secret; see .github/scripts/name_guard.py.

name: Disclosure

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disclosure-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.21.2

jobs:
  name-guard:
    name: Name and personal-details guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s .github/scripts -p 'test_name_guard.py' -v
      - name: Commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "range=$PR_BASE..$PR_HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "range=$BEFORE..$AFTER" >> "$GITHUB_OUTPUT"
          else
            echo "range=$AFTER~1..$AFTER" >> "$GITHUB_OUTPUT"
          fi
      - name: Check words, private identities and other people's emails
        env:
          NAME_GUARD_WORDS: ${{ secrets.NAME_GUARD_WORDS }}
          PR_TEXT: |
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}
          RANGE: ${{ steps.range.outputs.range }}
        run: python .github/scripts/name_guard.py --range "$RANGE" --text-env PR_TEXT

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --proto '=https' --proto-redir '=https' -o "$tarball" "$base/$tarball"
          curl -sSfL --proto '=https' --proto-redir '=https' -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]]; then
            range="$BEFORE..$AFTER"
          else
            range="$AFTER~1..$AFTER"
          fi
          ./gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="$range" .
