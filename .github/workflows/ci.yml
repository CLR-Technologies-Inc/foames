name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-foames-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The core must install and pass on plain Frappe, with no ERP.
          - name: Frappe v15
            frappe-branch: version-15
            python-version: '3.11'
            node-version: 18
            mariadb-image: mariadb:10.6
            erpnext-branch: ''
          - name: Frappe v16
            frappe-branch: version-16
            python-version: '3.14'
            node-version: 24
            mariadb-image: mariadb:11.8
            erpnext-branch: ''
          # The ERPNext adapter is exercised against the current stable ERPNext.
          - name: Frappe v16 + ERPNext
            frappe-branch: version-16
            python-version: '3.14'
            node-version: 24
            mariadb-image: mariadb:11.8
            erpnext-branch: version-16
    name: ${{ matrix.name }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: ${{ matrix.mariadb-image }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.frappe-branch }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.frappe-branch }}-pip-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch ${{ matrix.frappe-branch }} --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          if [ -n "${{ matrix.erpnext-branch }}" ]; then
            bench get-app --branch ${{ matrix.erpnext-branch }} erpnext
          fi
          bench get-app foames $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          if [ -n "${{ matrix.erpnext-branch }}" ]; then
            bench --site test_site install-app erpnext
          fi
          bench --site test_site install-app foames
          bench build --app foames
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app foames
        env:
          TYPE: server
