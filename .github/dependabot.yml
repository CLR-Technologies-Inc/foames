# Dependabot version updates. Security updates are switched on in the repository settings
# and cover the same manifests. Minor and patch bumps are grouped to keep the PR count low.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # The app itself (build requirements; Frappe is installed by bench), the bridges and the benchmark.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/bridges/bluesky"
      - "/bridges/historian"
      - "/benchmarks"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # Base images of the dev bench and the benchmark sandbox.
  - package-ecosystem: "docker"
    directories:
      - "/docker"
      - "/benchmarks/sandbox"
    schedule:
      interval: "weekly"

  # Images named in the dev bench's compose file (MariaDB, Redis).
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"

  # Actions used by the workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
