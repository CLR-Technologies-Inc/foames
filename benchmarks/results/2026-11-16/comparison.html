<style>
:root{--bg:#fbfbfa;--fg:#1d1f21;--muted:#5f6368;--line:#dcdcd8;--card:#ffffff;--pass:#d7efdc;--pass-fg:#165c2a;--fail:#f7dcdc;--fail-fg:#8a1c1c;--near:#fbedcc;--near-fg:#6b4a00;--accent:#2b5fd9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141516;--fg:#e8e8e6;--muted:#a0a3a7;--line:#33363a;--card:#1c1e20;--pass:#183a22;--pass-fg:#9fe0b1;--fail:#40191b;--fail-fg:#f3a7a7;--near:#3d3113;--near-fg:#f1d28c;--accent:#8fb0ff}}
:root[data-theme="dark"]{--bg:#141516;--fg:#e8e8e6;--muted:#a0a3a7;--line:#33363a;--card:#1c1e20;--pass:#183a22;--pass-fg:#9fe0b1;--fail:#40191b;--fail-fg:#f3a7a7;--near:#3d3113;--near-fg:#f1d28c;--accent:#8fb0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 20px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--accent)}
select{width:100%;padding:6px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px}
.bar{font-variant-numeric:tabular-nums;font-weight:600;font-size:18px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);white-space:normal;min-width:200px;max-width:300px}
th{font-size:12px;color:var(--muted);font-weight:600}
td.c{border-radius:0}
td.ok{background:var(--pass);color:var(--pass-fg)}
td.no{background:var(--fail);color:var(--fail-fg)}
td.near{background:var(--near);color:var(--near-fg)}
tr.ref td{font-style:italic;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 0;font-size:13px;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
footer{margin-top:18px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1 id="title">FoaMES agent benchmark comparison</h1>
<p class="sub" id="meta"></p>
<div class="controls">
 <div>
  <label for="bar">Reference bar</label>
  <input id="bar" type="range" min="0" max="100" step="1">
  <div class="bar" id="barText"></div>
 </div>
 <div>
  <label for="mode">Bar is measured against</label>
  <select id="mode">
   <option value="relative">Reference solution, per task</option>
   <option value="absolute">Absolute score (0 to 1)</option>
  </select>
 </div>

  <label for="metric">Score</label>
  <select id="metric">
   <option value="quality">Quality (correctness and process)</option>
   <option value="correctness">Engineering correctness</option>
   <option value="process">Process-development quality</option>
   <option value="composite">Composite (with efficiency)</option>
  </select>
 </div>
 <div>
  <label for="inv">Invariants</label>
  <select id="inv">
   <option value="yes">Must keep every invariant</option>
   <option value="no">Score only</option>
  </select>
 </div>
</div>
<div class="wrap"><table id="t"></table></div>
<div class="legend">
 <span><span class="sw" style="background:var(--pass)"></span>clears the bar</span>
 <span><span class="sw" style="background:var(--near)"></span>within 0.05 of the bar</span>
 <span><span class="sw" style="background:var(--fail)"></span>below the bar or broke an invariant</span>
</div>
<footer id="foot"></footer>

  });
  const all = Object.values(a.tasks).flat().map(r=>r[metric]);
  return {a, cells, cleared, avg: mean(all), ecl: eclReached(a, t => (a.tasks[t]||[]).length && (a.tasks[t]||[]).every(r => r[metric] >= need(t) - 1e-9 && (!inv || r.invariants_ok)))};
 }).sort((x,y)=> y.cleared-x.cleared || (y.avg??0)-(x.avg??0));
 let h = '<thead><tr><th>Agent and model</th><th>Tasks cleared</th><th>Mean</th>' + tasks.map(t=>`<th>${esc(t)}<div class="small">ECL ${esc((D.task_ecl||{})[t] ?? '-')}</div></th>`).join('') + '<th>Tokens in / out</th><th>Cost</th><th>List-price equiv.</th><th>ECL reached</th></tr></thead><tbody>';
 h += `<tr class="ref"><td>reference solution</td><td>${tasks.length}</td><td>${mean(tasks.map(t=>D.reference[t]?.[metric]??0)).toFixed(2)}</td>` + tasks.map(t=>`<td>${(D.reference[t]?.[metric]??0).toFixed(2)}</td>`).join('') + '<td></td><td></td><td></td><td></td></tr>';
 for(const r of rows){
  h += `<tr><td><b>${esc(r.a.agent)}</b><div class="small">${esc(r.a.model)} · ${esc(r.a.tier)} · ${esc(r.a.env)}${r.a.digest ? ' · ' + esc(r.a.digest) : ''}</div></td><td>${r.cleared} / ${tasks.length}</td><td>${r.avg==null?'':r.avg.toFixed(2)}</td>`;
  h += r.cells.map(c=>`<td class="c ${esc(c.cls)}" title="${esc(c.title)}">${esc(c.txt)}</td>`).join('');
  h += `<td>${esc(Number(r.a.tokens_in).toLocaleString())} / ${esc(Number(r.a.tokens_out).toLocaleString())}</td><td>${esc(r.a.cost)}</td><td>${esc(r.a.list_price)}</td><td>${esc(r.ecl)}</td></tr>`;
 }
 $('t').innerHTML = h + '</tbody>';
}
['bar','mode','metric','inv'].forEach(k=>$(k).addEventListener('input',render));
render();
</script>
</body>
</html>
