# gitleaks configuration: the default rules, minus test fixtures that hold fake credentials
# on purpose (for example the secret detectors' own tests) and the dev bench's example env file.

title = "FoaMES gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and documented placeholders"
paths = [
  '''(^|/)test_[^/]*\.py$''',
  '''(^|/)tests/''',
  '''^docker/\.env\.example$''',
]
