[project]
name = "foames-topology-collectors"
description = "Optional collectors that report network hosts and agent activity to the FoaMES topology graph"
authors = [{ name = "CLR Technologies Inc." }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
readme = "README.md"
classifiers = ["License :: OSI Approved :: Apache Software License"]
dynamic = ["version"]
# Standard library only.
dependencies = []

[project.scripts]
foames-topology-collect = "foames_topology_collectors.__main__:main"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"
